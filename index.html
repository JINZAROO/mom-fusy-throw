<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="360" height="640" aria-label="Game"></canvas>
    <div id="ui">
      <div id="home">
        <h1 id="logo"><span id="logo1"></span><span id="logo2"></span></h1>
        <button id="playBtn" class="btn pink" type="button"></button>
        <div id="homeBtns">
          <button id="stageBtn" class="btn blue" type="button"><span class="ico emo">🗺️</span><span data-t="stages"></span></button>
          <button id="shopBtn" class="btn" type="button"><span class="ico emo">⬆️</span><span data-t="shop"></span></button>
          <button id="setBtn" class="btn purple" type="button"><span class="ico emo">⚙️</span><span data-t="settings"></span></button>
          <button id="helpBtn" class="btn green" type="button"><span class="ico emo">❓</span><span data-t="help"></span></button>
        </div>
        <div id="bestPill" class="pill panel"></div>

      </div>
      <div id="hud" hidden>
        <div id="hudTop">
          <div id="stageBox" class="panel"><b id="stageText"></b> <span id="zoneText"></span><br><span id="waveText"></span></div>
          <div id="hudCoin" class="panel"><span class="coin"></span><span id="hudCoinVal">0</span></div>
          <button id="pauseBtn" class="btn white" type="button" aria-label="Pause">❚❚</button>
        </div>
        <button id="orbHelpBtn" class="btn white" type="button" aria-label="?">?</button>
      </div>
      <div id="pausePanel" class="panel" hidden>
        <h3 data-t="pause"></h3>
        <button id="resumeBtn" class="btn green" type="button" data-t="resume"></button>
        <button id="quitBtn" class="btn white" type="button" data-t="quit"></button>
      </div>
      <div id="over" class="panel" hidden>
        <h3 id="ovTitle"></h3>
        <div id="ovStars"></div>
        <div id="ovCoins"></div>
        <button id="reviveBtn" class="btn green" type="button"><span class="ad">AD</span><span data-t="revive"></span><small id="reviveLeft"></small></button>
        <button id="failDoubleBtn" class="btn blue" type="button"><span class="ad">AD</span><span data-t="doubleEnd"></span></button>
        <button id="doubleBtn" class="btn blue" type="button"><span class="ad">AD</span><span data-t="double"></span></button>

const splashG = $('splashCv').getContext('2d');
function drawSplash() {
  const g = splashG;
  g.fillStyle = '#15111d'; g.fillRect(0, 0, 483, 851);
  if (SPLASH_IMG.complete && SPLASH_IMG.naturalWidth) g.drawImage(SPLASH_IMG, 0, 0);
  g.fillStyle = '#15111d'; g.fillRect(40, 655, 400, 100);
  g.fillStyle = '#6d6080'; g.fillRect(69, 670, 345, 32); g.fillStyle = '#15111d'; g.fillRect(73, 674, 337, 24); g.fillStyle = '#231c2e'; g.fillRect(75, 676, 333, 20);
  const segs = Math.floor(intro.p * 30);
  for (let i = 0; i < segs; i++) { const x = 77 + i * 11; g.fillStyle = i % 2 ? '#ff9a2a' : '#ffc93c'; g.fillRect(x, 676, 9, 20); g.fillStyle = '#fff0a0'; g.fillRect(x, 676, 9, 2); }
}
function updateIntro(dt) {
  if (intro.done) return;
  intro.p = Math.min(fontsReady ? 1 : 0.85, intro.p + dt / 1.6);
  $('splashLoad').textContent = `LOADING ${Math.floor(intro.p * 100)}%`;
  drawSplash();
  if (intro.p >= 1) {
    intro.hold += dt;
    if (intro.hold > 0.6) {
      intro.done = true; $('intro').classList.add('out'); setTimeout(() => { $('intro').hidden = true; }, 520);
      applyText();
      if (!S.tutorialHide && S.best === 0) openTut();
    }
  }
}


/* =========================================================
   LOOP & LAYOUT
   ========================================================= */
function layout() { const w = $('wrap').clientWidth, hh = $('wrap').clientHeight; document.documentElement.style.setProperty('--u', Math.min(w / VW, hh / VH) + 'px'); }
addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play' && !G.paused) { G.paused = true; $('pausePanel').hidden = false; } });
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!intro.done) updateIntro(dt);
  else if (!G.paused && !overlayOpen()) update(dt);
  else if (G.mode === 'home') update(dt);
  render();
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').hidden = true; }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
  requestAnimationFrame(frame);
}
layout(); applyText(); showHome(); Platform.login(); requestAnimationFrame(frame);
})();
